# Postgres for local development. The password comes from local/.env
# (gitignored; copy .env.example), and the port is published on loopback only
# so the database isn't reachable from the rest of the network.
services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in local/.env}
      - POSTGRES_DB=media_pipeline
    ports:
      - 127.0.0.1:5432:5432
